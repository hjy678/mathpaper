<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初中数学自动出卷系统</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  #actModal{position:fixed;inset:0;background:rgba(20,28,48,.92);display:none;align-items:center;justify-content:center;z-index:9999}
  #actModal.show{display:flex}
  #actModal .card{background:#fff;color:#1f2a44;max-width:440px;width:90%;border-radius:16px;padding:26px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  #actModal h2{margin:0 0 6px;font-size:21px}
  #actModal .hint{font-size:13px;color:#6b7790;margin:10px 0 16px;line-height:1.7}
  #actModal input{width:100%;padding:11px 12px;font-size:16px;border:1px solid #d6e2ff;border-radius:10px;margin-bottom:12px;text-align:center;letter-spacing:3px;text-transform:uppercase}
  #actModal .go{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:15px;cursor:pointer;width:100%}
  #actModal #actMsg{min-height:18px;font-size:13px;margin-top:10px}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#1f2a44;color:#fff;padding:9px 16px;border-radius:9px;font-size:14px;z-index:10000;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
  .toast.show{opacity:1}
  #actEntry{cursor:pointer;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:5px 14px;font-size:13px}
  #memberBadge{display:none;background:#ffe9b0;color:#8a5300;border-radius:999px;padding:3px 10px;font-size:12px;margin-left:4px}
</style>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --line:#e3e8f0; --ink:#1f2a44;
    --muted:#6b7790; --brand:#2f6df0; --brand2:#1657c8; --ok:#1f9d55; --warn:#e0820c;
    --paper:#ffffff; --paperline:#0a0a0a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header.app{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;
       padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  header.app h1{margin:0;font-size:19px;letter-spacing:1px}
  header.app .sub{font-size:12px;opacity:.9}
  .wrap{display:flex;gap:16px;padding:16px;align-items:flex-start}
  .side{width:340px;flex:0 0 340px;background:var(--panel);border:1px solid var(--line);
       border-radius:12px;padding:16px;position:sticky;top:12px}
  .main{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .sec{margin-bottom:18px}
  .sec h3{margin:0 0 10px;font-size:14px;border-left:4px solid var(--brand);padding-left:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:#eef3ff;border:1px solid #d6e2ff;
       color:var(--brand2);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;user-select:none}
  .chip input{accent-color:var(--brand)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .topics{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;border:1px dashed var(--line);padding:8px;border-radius:8px}
  .topic-group{font-size:12px;color:var(--muted);margin-top:4px}
  .topic-item{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 0;margin-left:6px}
  .field{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:13px}
  .field label{width:84px;color:var(--muted);flex:0 0 84px}
  .field input[type=text],.field input[type=number]{flex:1;border:1px solid var(--line);border-radius:7px;
       padding:6px 8px;font-size:13px;background:#fff;color:var(--ink)}
  .diffrow{display:flex;gap:8px}
  .diffrow .field{flex:1}
  .diffrow .field label{width:auto}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:14px;
       cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--brand2)}
  .btn.ghost{background:#eef3ff;color:var(--brand2);border:1px solid #d6e2ff}
  .btn.sm{padding:6px 10px;font-size:13px}
  .stats{font-size:12px;color:var(--muted);background:#f7f9fc;border:1px solid var(--line);
       border-radius:8px;padding:8px 10px;margin-top:6px}
  .stats b{color:var(--ink)}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{padding:7px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;background:#fff}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .paper{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:28px 34px;
        max-width:820px;margin:0 auto;color:#111}
  .paper .phead{text-align:center;margin-bottom:10px}
  .paper .ptitle{font-size:20px;font-weight:700;letter-spacing:1px}
  .paper .pmeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:13px;margin:8px 0 4px;
        border-bottom:1.5px solid var(--paperline);padding-bottom:8px}
  .paper .pinfo{font-size:13px;margin:8px 0;display:flex;gap:18px;flex-wrap:wrap}
  .paper .sech{font-weight:700;margin:14px 0 6px;font-size:15px}
  .q{display:flex;gap:8px;margin:9px 0;font-size:14px;line-height:1.7;break-inside:avoid}
  .q .n{flex:0 0 26px;text-align:right;color:#333}
  .q .b{flex:1}
  .opts{display:flex;flex-wrap:wrap;gap:4px 22px;margin:3px 0 0 0}
  .opt{display:inline-flex;gap:4px}
  .blank{border-bottom:1px solid #333;display:inline-block;min-width:46px;height:18px;margin:0 2px;vertical-align:middle}
  .ans{color:#b00020;font-size:13px;margin-top:2px}
  .ans b{color:#b00020}
  .keytable{margin-top:14px;border-top:1.5px solid var(--paperline);padding-top:8px;font-size:13px}
  .warn{background:#fff5e6;border:1px solid #ffd9a0;color:#8a5300;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
  .hidden{display:none!important}
  @media (max-width:900px){.wrap{flex-direction:column}.side{width:100%;flex:none;position:static}}
  @media print{
    body{background:#fff}
    header.app,.side,.tabs,.toolbar,.nonprint{display:none!important}
    .wrap{padding:0;display:block}
    .main,.paper{border:none;border-radius:0;padding:0;max-width:none}
    body.print-stu .paper.teacher{display:none!important}
    body.print-tea .paper.student{display:none!important}
    .paper{box-shadow:none}
  }
</style>
</head>
<body>
<header class="app">
  <div>
    <h1>初中数学自动出卷系统</h1>
    <div class="sub">内置题库 · 按知识点+难度抽题 · 学生版/教师版双卷 · 离线可跑</div>
  </div>
  <div class="sub" style="display:flex;align-items:center;gap:10px">
    <span>v2.0 · 题库 245 题</span>
    <span id="memberBadge">已激活</span>
    <span id="actEntry" onclick="openAct()">👑 会员激活</span>
  </div>
</header>

<div id="actModal">
  <div class="card">
    <h2>数学出卷 · 会员激活</h2>
    <div class="hint">请输入管理员提供的激活码（形如 HJY3-XXXXXX）。激活后解锁全部出卷与导出功能；未激活无法使用本工具。</div>
    <input id="actInput" placeholder="HJY3-******" maxlength="24" autocomplete="off">
    <button class="go" onclick="doActivate()">激活</button>
    <div id="actMsg"></div>
  </div>
</div>

<div class="wrap">
  <!-- 左侧设置 -->
  <aside class="side">
    <div class="sec">
      <h3>① 选择年级</h3>
      <div class="row" id="gradeRow"></div>
    </div>

    <div class="sec">
      <h3>② 选择知识点（不选=对应年级全部）</h3>
      <div class="topics" id="topicBox"></div>
    </div>

    <div class="sec">
      <h3>③ 难度配比（题数）</h3>
      <div class="diffrow">
        <div class="field"><label>基础</label><input type="number" id="dEasy" value="8" min="0"></div>
        <div class="field"><label>中等</label><input type="number" id="dMid" value="8" min="0"></div>
        <div class="field"><label>拔高</label><input type="number" id="dHard" value="4" min="0"></div>
      </div>
      <div class="stats" id="poolStats">请先选择年级/知识点</div>
    </div>

    <div class="sec">
      <h3>③-扩展 卷型模板与出卷顺序</h3>
      <div class="field"><label>卷型模板</label>
        <select id="tpl" style="flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px">
          <option value="custom">自定义（手动设难度）</option>
          <option value="week">周测（基础6/中等4）</option>
          <option value="month">月考（基础10/中等10/拔高4）</option>
          <option value="final">期末（基础14/中等14/拔高8）</option>
        </select>
      </div>
      <div class="field"><label>出卷顺序</label>
        <span style="flex:1;font-size:13px">
          <label style="width:auto;margin-right:14px"><input type="radio" name="order" value="random" checked> 随机抽题</label>
          <label style="width:auto"><input type="radio" name="order" value="seq"> 按章节顺序</label>
        </span>
      </div>
    </div>

    <div class="sec">
      <h3>④ 卷头信息</h3>
      <div class="field"><label>学校</label><input type="text" id="fSchool" value="某某中学"></div>
      <div class="field"><label>年级/班级</label><input type="text" id="fClass" value="八年级（3）班"></div>
      <div class="field"><label>姓名</label><input type="text" id="fName" value="__________"></div>
      <div class="field"><label>学号</label><input type="text" id="fNo" value="__________"></div>
      <div class="field"><label>满分</label><input type="number" id="fFull" value="100" min="0"></div>
      <div class="field"><label>考试时间</label><input type="text" id="fTime" value="90 分钟"></div>
    </div>

    <div class="sec">
      <button class="btn" id="genBtn" style="width:100%">生成试卷</button>
      <div style="height:8px"></div>
      <button class="btn ghost sm" id="resetBtn" style="width:100%">恢复默认设置</button>
    </div>
  </aside>

  <!-- 右侧预览 -->
  <main class="main">
    <div class="tabs">
      <div class="tab on" data-v="student" id="tabStu">学生版（无答案）</div>
      <div class="tab" data-v="teacher" id="tabTea">教师版（含答案）</div>
    </div>
    <div class="toolbar nonprint">
      <button class="btn sm" id="printStu">打印/存PDF · 学生版</button>
      <button class="btn sm" id="printTea">打印/存PDF · 教师版</button>
      <button class="btn ghost sm" id="docxStu">导出 Word · 学生版</button>
      <button class="btn ghost sm" id="docxTea">导出 Word · 教师版</button>
    </div>
    <div id="previewArea">
      <div class="paper student" id="paperStu"></div>
      <div class="paper teacher hidden" id="paperTea"></div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   题库：初中数学 七/八/九 核心章节，答案已核验
   字段：g年级(7/8/9) t知识点 d难度(基础/中等/拔高)
        type题型(选择/填空/解答) stem题干 options选项 answer答案 solution解析
   选择题 answer 为正确选项字母 A/B/C/D
   ============================================================ */
const BANK = [
  // ---------- 七年级 ----------
  {g:7,t:"有理数",d:"基础",type:"选择",stem:"下列各数中，是负数的是（ ）。",options:["0","3","-2","1/2"],answer:"C"},
  {g:7,t:"有理数",d:"基础",type:"选择",stem:"-5 的相反数是（ ）。",options:["5","-5","1/5","-1/5"],answer:"A"},
  {g:7,t:"有理数",d:"基础",type:"填空",stem:"|-7| = ______。",answer:"7"},
  {g:7,t:"有理数",d:"中等",type:"选择",stem:"数轴上表示 -3 的点到原点的距离是（ ）。",options:["3","-3","1/3","-1/3"],answer:"A"},
  {g:7,t:"有理数",d:"基础",type:"解答",stem:"计算：(-12) + 7 = ______。",answer:"-5"},
  {g:7,t:"有理数",d:"中等",type:"解答",stem:"计算：(-3) × (-4) - 8 ÷ (-2) = ______。",answer:"12 + 4 = 16，结果 16"},

  {g:7,t:"整式加减",d:"基础",type:"选择",stem:"下列各式中，是同类项的是（ ）。",options:["2x 与 3y","x² 与 2x","3ab 与 -5ab","a²b 与 ab²"],answer:"C"},
  {g:7,t:"整式加减",d:"基础",type:"填空",stem:"化简：3a + 2a = ______。",answer:"5a"},
  {g:7,t:"整式加减",d:"中等",type:"解答",stem:"化简：3x² - 2x + 4x² - 5x = ______。",answer:"7x² - 7x"},
  {g:7,t:"整式加减",d:"基础",type:"填空",stem:"单项式 -3x²y 的系数是 ______。",answer:"-3"},

  {g:7,t:"一元一次方程",d:"基础",type:"选择",stem:"方程 2x - 6 = 0 的解是（ ）。",options:["x=3","x=-3","x=2","x=-2"],answer:"A"},
  {g:7,t:"一元一次方程",d:"中等",type:"解答",stem:"解方程：3x + 5 = 2x - 1。",answer:"移项得 3x - 2x = -1 - 5，x = -6"},
  {g:7,t:"一元一次方程",d:"拔高",type:"解答",stem:"甲、乙两人相距 30 km，相向而行，甲速 4 km/h，乙速 6 km/h，几小时后相遇？",answer:"30 ÷ (4+6) = 3，3 小时相遇"},
  {g:7,t:"一元一次方程",d:"中等",type:"解答",stem:"某商品进价 80 元，标价 120 元，打 x 折后利润率为 20%，求 x。",answer:"售价=80×1.2=96；120×(x/10)=96，x=8，即打 8 折"},
  {g:7,t:"一元一次方程",d:"基础",type:"解答",stem:"一个数 x 的 3 倍减 7 等于 8，求 x。",answer:"3x - 7 = 8，3x = 15，x = 5"},

  {g:7,t:"几何图形初步",d:"基础",type:"选择",stem:"下列图形中，是立体图形的是（ ）。",options:["三角形","长方形","正方体","线段"],answer:"C"},
  {g:7,t:"几何图形初步",d:"基础",type:"填空",stem:"一个锐角的余角是 30°，这个角是 ______°。",answer:"60"},
  {g:7,t:"几何图形初步",d:"中等",type:"选择",stem:"过两点可以画（ ）条直线。",options:["0","1","2","无数条"],answer:"B"},

  {g:7,t:"二元一次方程组",d:"基础",type:"选择",stem:"下列是二元一次方程组的是（ ）。",options:["x+y=1，1/x+y=2","x+y=1，y+z=2","x+y=1，x-y=0","x²+y=1"],answer:"C"},
  {g:7,t:"二元一次方程组",d:"中等",type:"解答",stem:"解方程组：x + y = 5，x - y = 1。",answer:"两式相加得 2x=6，x=3；代入得 y=2。解：x=3，y=2"},
  {g:7,t:"二元一次方程组",d:"拔高",type:"解答",stem:"买 3 支笔和 2 个本共 19 元，2 支笔和 3 个本共 21 元，求笔和本的单价。",answer:"设笔 a 元、本 b 元：3a+2b=19，2a+3b=21；解得 a=3，b=5。笔 3 元，本 5 元"},

  {g:7,t:"不等式",d:"基础",type:"选择",stem:"不等式 2x > 6 的解集是（ ）。",options:["x>3","x<3","x>2","x<-3"],answer:"A"},
  {g:7,t:"不等式",d:"中等",type:"解答",stem:"解不等式：3x - 5 ≤ 2x + 1。",answer:"移项得 x ≤ 6"},

  {g:7,t:"数据收集",d:"基础",type:"选择",stem:"要反映各部分在总体中所占比例，应画（ ）。",options:["条形图","折线图","扇形图","直方图"],answer:"C"},

  // ---------- 八年级 ----------
  {g:8,t:"三角形与全等",d:"基础",type:"选择",stem:"三角形内角和是（ ）。",options:["90°","180°","360°","270°"],answer:"B"},
  {g:8,t:"三角形与全等",d:"中等",type:"选择",stem:"下列各组线段能组成三角形的是（ ）。",options:["2，3，6","3，4，5","1，2，3","5，5，11"],answer:"B"},
  {g:8,t:"三角形与全等",d:"基础",type:"填空",stem:"等腰三角形两边长分别为 3 和 7，周长是 ______。",answer:"17（腰只能是 7，3+7+7=17）"},
  {g:8,t:"三角形与全等",d:"中等",type:"解答",stem:"已知△ABC ≌ △DEF，AB=5，BC=6，AC=7，求△DEF 的周长。",answer:"全等三角形周长相等，5+6+7=18，周长为 18"},
  {g:8,t:"三角形与全等",d:"拔高",type:"选择",stem:"下列命题正确的是（ ）。",options:["全等三角形面积相等","面积相等的三角形全等","周长相等的三角形全等","以上都不对"],answer:"A"},

  {g:8,t:"轴对称",d:"基础",type:"选择",stem:"下列图形中，是轴对称图形的是（ ）。",options:["平行四边形","任意三角形","等腰三角形","一般梯形"],answer:"C"},
  {g:8,t:"轴对称",d:"基础",type:"填空",stem:"线段垂直平分线上的点到线段两端距离 ______。",answer:"相等"},

  {g:8,t:"整式乘法与因式分解",d:"基础",type:"解答",stem:"计算：(a³)² = ______。",answer:"a⁶"},
  {g:8,t:"整式乘法与因式分解",d:"基础",type:"解答",stem:"计算：(x+2)(x-3) = ______。",answer:"x² - x - 6"},
  {g:8,t:"整式乘法与因式分解",d:"中等",type:"填空",stem:"因式分解：x² - 9 = ______。",answer:"(x+3)(x-3)"},
  {g:8,t:"整式乘法与因式分解",d:"拔高",type:"填空",stem:"因式分解：x² + 4x + 4 = ______。",answer:"(x+2)²"},

  {g:8,t:"分式",d:"基础",type:"选择",stem:"要使分式 1/(x-2) 有意义，x 应满足（ ）。",options:["x≠2","x=2","x≠0","x>2"],answer:"A"},
  {g:8,t:"分式",d:"中等",type:"解答",stem:"化简：(x²-1)/(x+1) = ______。",answer:"(x-1)(x+1)/(x+1) = x-1"},
  {g:8,t:"分式",d:"中等",type:"解答",stem:"解方程：2/(x-1) = 1/x。",answer:"交叉相乘 2x = x-1，x = -1；检验 x=-1 时分母不为 0，故 x=-1"},
  {g:8,t:"分式",d:"中等",type:"选择",stem:"当 x=2 时，分式 (x²-4)/(x-2) 的值为（ ）。",options:["0","4","2","无意义"],answer:"B",solution:"化简为 x+2，代入 x=2 得 4"},

  {g:8,t:"二次根式",d:"基础",type:"选择",stem:"二次根式 √x 在实数范围内有意义，x 的取值范围是（ ）。",options:["x>0","x≥0","x≠0","x≤0"],answer:"B"},
  {g:8,t:"二次根式",d:"基础",type:"解答",stem:"化简：√16 = ______。",answer:"4"},
  {g:8,t:"二次根式",d:"中等",type:"解答",stem:"计算：√18 + √8 = ______。",answer:"3√2 + 2√2 = 5√2"},

  {g:8,t:"勾股定理",d:"中等",type:"解答",stem:"旗杆高 8 m，绳子拉到距杆底 6 m 处固定，求绳子长度。",answer:"√(8²+6²)=√100=10，绳长 10 m"},

function currentPool(){

}

/* ---------------- 组卷算法 ---------------- */
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickFrom(pool,need){
  const sh=shuffle(pool);
  return sh.slice(0,Math.min(need,sh.length));
}
function generate(){
  const pool=currentPool();
  if(pool.length===0){alert('当前选择下题库为空，请调整年级或知识点。');return;}
  let needE=+document.getElementById('dEasy').value||0;
  let needM=+document.getElementById('dMid').value||0;
  let needH=+document.getElementById('dHard').value||0;
  const byDiff={基础:pool.filter(q=>q.d==='基础'),中等:pool.filter(q=>q.d==='中等'),拔高:pool.filter(q=>q.d==='拔高')};
  let chosen=[];
  const usedIds=new Set();
  const take=(list,n)=>{let c=0;for(const q of shuffle(list)){if(c>=n)break;if(usedIds.has(q._i))continue;chosen.push(q);usedIds.add(q._i);c++;}return c;};
  BANK.forEach((q,i)=>q._i=i); // 标记索引
  let gotE=take(byDiff.基础,needE), gotM=take(byDiff.中等,needM), gotH=take(byDiff.拔高,needH);
  let totalReq=needE+needM+needH;
  let got=gotE+gotM+gotH;
  // 不足部分从剩余题库补齐（任意难度）
  if(got<totalReq){
    const rest=pool.filter(q=>!usedIds.has(q._i));
    const add=shuffle(rest).slice(0,totalReq-got);
    add.forEach(q=>{chosen.push(q);usedIds.add(q._i);});
    got=chosen.length;
  }
  // 按题型分组并随机排序，再顺序编号
  if(state.order==='seq'){
    const ti={}; [7,8,9].forEach(g=>GRADE_TOPICS[g].forEach((t,i)=>{ti[t]=i;}));
    const dr={基础:0,中等:1,拔高:2};
    chosen=chosen.sort((a,b)=> a.g-b.g || (ti[a.t]-ti[b.t]) || (dr[a.d]-dr[b.d]) || TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type));
  } else {
    chosen=chosen.sort((a,b)=> TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type) || Math.random()-0.5);
  }
  renderPapers(chosen,{reqE:needE,reqM:needM,reqH:needH,gotE:gotE,gotM:gotM,gotH:gotH,requested:totalReq});
}

function fmtOptions(q){

}
function answerText(q){

}
function renderPapers(list,info){
  const full=+document.getElementById('fFull').value||100;

  const nFill=list.filter(q=>q.type==='填空').length;
  const nSol=list.filter(q=>q.type==='解答').length;
  let perSel=3,perFill=3;
  let remain=full-(nSel*perSel+nFill*perFill);
  let perSol=nSol>0?Math.max(1,Math.round(remain/nSol)):0;
  if(remain<0){perSel=perFill=perSol=Math.max(1,Math.floor(full/list.length));}
  const scoreOf=q=> q.type==='选择'?perSel : q.type==='填空'?perFill : perSol;

  function buildBody(showAnswer){
    let html='';

        if(showAnswer){

             (q.solution?`　<b>【解析】</b>${q.solution}`:'')+`</div>`;
        }
        html+=`<div class="q"><div class="n">${no}.</div><div class="b">${b}</div></div>`;
      });
    });
    return html;
  }
  function head(){
    return `<div class="phead"><div class="ptitle">${school} 数学试卷</div></div>
      <div class="pmeta"><span>班级：${cls}</span><span>姓名：${name}</span><span>学号：${no}</span><span>满分：${full}</span><span>时间：${time}</span></div>
      <div class="pinfo"><span>一、请认真审题，仔细作答。</span><span>二、书写工整，步骤完整。</span></div>`;
  }
  const stu=document.getElementById('paperStu');
  const tea=document.getElementById('paperTea');

  let teaHtml=head()+buildBody(true);
  // 教师版附加参考答案汇总
  teaHtml+=`<div class="keytable"><div class="sech">参考答案</div>`;
  let nn=0;
  TYPE_ORDER.forEach(tp=>{
    list.filter(q=>q.type===tp).forEach(q=>{nn++;teaHtml+=`<span style="display:inline-block;min-width:120px">${nn}. ${answerText(q)}</span>`;});
  });
  teaHtml+='</div>';
  tea.innerHTML=teaHtml;

  // 警告信息
  let warn='';
  if(info.gotE<info.reqE||info.gotM<info.reqM||info.gotH<info.reqH){
    warn+=`⚠️ 题库不足，已自动从其他难度补齐：基础 ${info.gotE}/${info.reqE}，中等 ${info.gotM}/${info.reqM}，拔高 ${info.gotH}/${info.reqH}。`;
  }
  // 把警告放到预览区顶部
  let w=document.getElementById('warnBox');
  if(!w){w=document.createElement('div');w.id='warnBox';w.className='warn nonprint';document.getElementById('previewArea').parentNode.insertBefore(w,document.getElementById('previewArea'));}

/* ---------------- Word (.docx) 导出 ---------------- */
function escapeXml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function crc32(bytes){
  let table=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);table[n]=c>>>0;}
  let crc=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)crc=table[(crc^bytes[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function buildZip(files){
  const enc=new TextEncoder();let parts=[];let central=[];let offset=0;
  for(const f of files){
    const nameBytes=enc.encode(f.name);const data=f.data;const crc=crc32(data);
    const local=new Uint8Array(30+nameBytes.length+data.length);const dv=new DataView(local.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);dv.setUint16(8,0,true);
    dv.setUint16(10,0,true);dv.setUint16(12,0,true);dv.setUint32(14,crc,true);
    dv.setUint32(18,data.length,true);dv.setUint32(22,data.length,true);
    dv.setUint16(26,nameBytes.length,true);dv.setUint16(28,0,true);
    local.set(nameBytes,30);local.set(data,30+nameBytes.length);parts.push(local);
    const cen=new Uint8Array(46+nameBytes.length);const cv=new DataView(cen.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0,true);
    cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
    cv.setUint16(28,nameBytes.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,offset,true);
    cen.set(nameBytes,46);central.push(cen);offset+=local.length;
  }
  const centralSize=central.reduce((s,c)=>s+c.length,0);
  const end=new Uint8Array(22);const ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
  let total=offset+centralSize+end.length;const out=new Uint8Array(total);let pos=0;
  for(const p of parts){out.set(p,pos);pos+=p.length;}
  for(const c of central){out.set(c,pos);pos+=c.length;}
  out.set(end,pos);return out;
}
function exportDocx(container,filename){
  const text=container.innerText.replace(/\r/g,'');
  const lines=text.split('\n');
  let body='';
  for(const line of lines){
    const t=line.trim();
    if(t==='') body+='<w:p/>';
    else body+=`<w:p><w:r><w:t xml:space="preserve">${escapeXml(t)}</w:t></w:r></w:p>`;
  }
  const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}</w:body></w:document>`;
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`;
  const enc=new TextEncoder();
  const files=[
    {name:'[Content_Types].xml',data:enc.encode(contentTypes)},
    {name:'_rels/.rels',data:enc.encode(rels)},
    {name:'word/document.xml',data:enc.encode(documentXml)},
    {name:'word/_rels/document.xml.rels',data:enc.encode(docRels)}
  ];
  const zip=buildZip(files);
  const blob=new Blob([zip],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

<script>

const ACT_BACKEND='https://hjy3-member-hub.app.workbuddy.host';

const ACT_FP_KEY='mathpaper_fp';
const ACT_TTL=24*60*60*1000;
const ACT_OFFLINE_GRACE=3*24*60*60*1000;

function getActivation(){try{return JSON.parse(localStorage.getItem(ACT_STORE)||'null');}catch(e){return null;}}
function setActivation(a){try{localStorage.setItem(ACT_STORE,JSON.stringify(a));}catch(e){}}
function clearActivation(){try{localStorage.removeItem(ACT_STORE);}catch(e){}}
function fmtExp(exp){return exp? new Date(exp).toLocaleDateString('zh-CN'):'永久';}
function deviceFp(){
  var fp=null;
  try{fp=localStorage.getItem(ACT_FP_KEY);}catch(e){}
  if(!fp){fp='dev_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{localStorage.setItem(ACT_FP_KEY,fp);}catch(e){}}
  return fp;
}
function localToken(){
  var a=getActivation();
  if(!a||!a.token)return null;
  if(a.system&&a.system!==ACT_SYSTEM)return null;
  if(a.expire&&a.expire<=Date.now())return null;
  return a.token;
}
function isActivated(){
  var a=getActivation();
  return !!(a&&a.token&&(!a.expire||a.expire>Date.now())&&(!a.system||a.system===ACT_SYSTEM));
}
function renderMember(){
  var badge=document.getElementById('memberBadge');
  var on=isActivated();
  if(badge)badge.style.display=on?'inline-block':'none';
}
function tokSig(t){
  var h=5381,i=0;
  t=String(t||'');
  for(i=0;i<t.length;i++){h=((h<<5)+h+t.charCodeAt(i))>>>0;}
  return t.length.toString(36)+'_'+h.toString(36);
}
function verifyToken(force){
  var a=getActivation();
  var token=localToken();
  if(!token)return Promise.resolve({ok:false,reason:'no_token'});
  if(!force&&a.verifyAt&&a.verified===true&&a.tokenSig&&a.tokenSig===tokSig(token)&&(Date.now()-a.verifyAt)<ACT_TTL){
    return Promise.resolve({ok:true,cached:true,level:a.plan,expireAt:a.expire});
  }
  var url=ACT_BACKEND+'/api/verify?token='+encodeURIComponent(token)+'&fp='+encodeURIComponent(deviceFp())+'&system='+encodeURIComponent(ACT_SYSTEM);
  return fetch(url,{method:'GET'})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j&&j.ok){
        a.plan=j.level||a.plan; a.expire=j.expireAt||0; a.system=ACT_SYSTEM; a.token=token;
        a.verified=true; a.verifyAt=Date.now(); a.tokenSig=tokSig(token); a.lastOnlineAt=Date.now(); a.offlineSince=0;
        setActivation(a);
        return {ok:true,level:a.plan,expireAt:a.expire};
      }
      clearActivation();
      return {ok:false,reason:(j&&j.reason)||'denied',msg:(j&&j.msg)||''};
    })
    .catch(function(){
      var b=getActivation();
      if(!b||!b.token)return {ok:false,reason:'offline_no_cache'};
      if(b.tokenSig!==tokSig(b.token))return {ok:false,reason:'offline_untrusted'};
      var since=b.lastOnlineAt||b.verifyAt||b.at||0;
      if(!since)return {ok:false,reason:'offline_not_activated'};
      var off=(Date.now()-since)<ACT_OFFLINE_GRACE;
      if(off&&(!b.expire||b.expire>Date.now())){
        if(!b.offlineSince){b.offlineSince=Date.now();setActivation(b);}
        return {ok:true,offline:true,level:b.plan,expireAt:b.expire};
      }
      return {ok:false,reason:'offline_expired',msg:'离线时间过长，请联网后重试'};
    });
}
// 门禁入口：所有付费功能都走这里；本工具为整体门禁，故仅 openAct / boot 使用

  verifyToken(false).then(function(v){
    if(v.ok){ if(v.offline)toast('离线模式 · '+(v.level||'会员')); if(allowed)allowed(); }
    else { var reasons={no_token:'请先激活会员',bad_token:'会员凭证无效，请重新激活',legacy_token:'会员凭证版本过旧，请重新激活',blacklisted:'该会员已被停用，请联系客服',wrong_system:'该激活码不适用于当前系统',device_mismatch:'会员与当前设备不匹配，请在本设备使用',offline_expired:'离线时间过长，请联网后重试',offline_untrusted:'会员校验未通过，请联网后重试',offline_no_cache:'请先联网激活会员',offline_not_activated:'请先联网激活会员',denied:'会员校验未通过'};
      toast(reasons[v.reason]||v.msg||'会员校验未通过'); openAct(); if(denied)denied(); }
  });
}
function openAct(){
  var m=document.getElementById('actModal'); if(m)m.classList.add('show');
  renderMember();
  var inp=document.getElementById('actInput'); if(inp){inp.value=''; try{inp.focus();}catch(e){}}
  var msg=document.getElementById('actMsg'); if(msg)msg.textContent='';
}
function doActivate(){
  var el=document.getElementById('actInput');
  var code=el?el.value.trim().toUpperCase():'';
  var msg=document.getElementById('actMsg');
  if(!code){ if(msg){msg.style.color='#e33';msg.textContent='请输入激活码';} return; }
  if(msg){msg.style.color='';msg.textContent='联网验证中…';}
  var fp=deviceFp();
  fetch(ACT_BACKEND+'/api/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,fp:fp,system:ACT_SYSTEM})})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j.ok){
        setActivation({plan:j.level,expire:j.expireAt||0,system:ACT_SYSTEM,token:j.token,at:Date.now(),verified:true,verifyAt:Date.now(),tokenSig:tokSig(j.token),lastOnlineAt:Date.now(),offlineSince:0});
        if(msg){msg.style.color='#1a9';msg.textContent='✅ 激活成功！'+j.level+(j.expireAt?(' · 至 '+fmtExp(j.expireAt)):' · 永久');}
        renderMember(); toast('会员已激活');
        var mm=document.getElementById('actModal'); if(mm)mm.classList.remove('show');
        generate();
      }else{
        var reasons={not_found:'激活码无效，请检查后重试',void:'该激活码已作废',already_used:'该激活码已被使用（一码一用）',blacklisted:'该激活码已被停用',wrong_system:'该激活码不适用于当前系统'};
        if(msg){msg.style.color='#e33';msg.textContent='❌ '+(reasons[j.reason]||'激活失败');}
      }
    })
    .catch(function(){if(msg){msg.style.color='#e33';msg.textContent='⚠️ 联网验证失败，请检查网络后重试';}});
}
// === 启动引导：已激活则出卷，未激活显示激活层 ===
function appBoot(){
  renderMember();
  var modal=document.getElementById('actModal');
  if(isActivated() && localToken()){
    if(modal)modal.classList.remove('show');
    generate();
    verifyToken(true).then(function(v){ if(!v.ok){ if(modal)modal.classList.add('show'); toast('会员状态已变更，请重新激活'); } });
  } else {
    if(modal)modal.classList.add('show');
  }
}
appBoot();
</script>
